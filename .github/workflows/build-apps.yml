name: Build apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest # Apple Silicon
            label: apple-silicon
          - runner: macos-15-intel # Intel
            label: intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build app
        run: bash scripts/build-mac.sh

      - name: Zip (keeps executable bit)
        run: |
          cd dist
          zip -j "GLF-Assessment-Scheduler-mac-${{ matrix.label }}.zip" "GLF Assessment Scheduler"

      - uses: actions/upload-artifact@v4
        with:
          name: GLF-Assessment-Scheduler-mac-${{ matrix.label }}
          path: dist/GLF-Assessment-Scheduler-mac-${{ matrix.label }}.zip
          retention-days: 1

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build exe
        shell: powershell
        run: ./scripts/build-exe.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: GLF-Assessment-Scheduler-windows
          path: dist/GLF Assessment Scheduler.exe
          retention-days: 1
