<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GLF Scheduler</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="panel">
        <div class="masthead">
          <div>
            <p class="eyebrow">SGH GLF</p>
            <h1>Assessment Scheduler</h1>
          </div>
          <div class="status-pill" id="statusPill">Ready</div>
        </div>

        <form id="scheduleForm" class="form">
          <label class="file-field">
            <span>Roster ward allocation workbook</span>
            <input id="roster" name="roster" type="file" accept=".xlsx,.xlsm,.xls" required />
          </label>

          <label class="file-field">
            <span>GLF assessment overview workbook</span>
            <input id="glf" name="glf" type="file" accept=".xlsx,.xlsm,.xls" required />
          </label>

          <label class="password-field">
            <span>GLF workbook password</span>
            <input id="password" name="password" type="password" autocomplete="off" />
          </label>

          <button id="submitButton" type="submit">Generate Schedule</button>
        </form>
      </section>

      <section class="results" id="results" hidden>
        <div class="summary-grid">
          <div>
            <span>Scheduled</span>
            <strong id="scheduledCount">0</strong>
          </div>
          <div>
            <span>Unscheduled</span>
            <strong id="unscheduledCount">0</strong>
          </div>
          <div>
            <span>Pending slots</span>
            <strong id="pendingCount">0</strong>
          </div>
        </div>

        <a class="download" id="downloadLink" href="#">Download Updated Workbook</a>

        <div class="tables">
          <section>
            <h2>Assessor Load</h2>
            <div id="loadList" class="list"></div>
          </section>
          <section>
            <h2>Assignments</h2>
            <div id="assignmentList" class="list"></div>
          </section>
          <section id="unscheduledSection" hidden>
            <h2>Unscheduled</h2>
            <div id="unscheduledList" class="list"></div>
          </section>
        </div>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
