<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GLF Scheduler</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="app">
    <section class="panel">
      <div class="title-row">
        <div>
          <h1>GLF Scheduler</h1>
          <p>Upload the roster ward allocation and GLF assessment overview to generate the final assessment schedule.</p>
        </div>
        <div class="badge">Ward + OPS rules</div>
      </div>

      <form id="schedule-form" class="upload-grid">
        <label class="file-box">
          <span>Roster ward allocation</span>
          <input name="roster" type="file" accept=".xlsx,.xls" required>
        </label>
        <label class="file-box">
          <span>GLF assessment overview</span>
          <input name="glf" type="file" accept=".xlsx,.xls" required>
        </label>
        <label class="password-box">
          <span>GLF workbook password</span>
          <input name="password" type="password" placeholder="Required if the workbook is encrypted">
        </label>
        <button id="run-button" type="submit">Generate schedule</button>
      </form>
    </section>

    <section class="summary" id="summary" hidden>
      <div class="metric">
        <span id="tasks-count">0</span>
        <label>Tasks found</label>
      </div>
      <div class="metric">
        <span id="scheduled-count">0</span>
        <label>Scheduled</label>
      </div>
      <div class="metric warning">
        <span id="unscheduled-count">0</span>
        <label>Unscheduled</label>
      </div>
      <a class="download" id="download-link" href="#">Download Excel</a>
    </section>

    <section class="panel" id="results-panel" hidden>
      <div class="table-head">
        <h2>Final Schedule</h2>
        <span id="status-text"></span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Assessee</th>
              <th>Assessment</th>
              <th>Assessor</th>
              <th>Assessee location</th>
              <th>Assessor location</th>
            </tr>
          </thead>
          <tbody id="schedule-body"></tbody>
        </table>
      </div>
    </section>

    <section class="panel error-panel" id="error-panel" hidden>
      <h2>Needs attention</h2>
      <p id="error-text"></p>
    </section>
  </main>

  <script>
    const form = document.getElementById("schedule-form");
    const button = document.getElementById("run-button");
    const errorPanel = document.getElementById("error-panel");
    const errorText = document.getElementById("error-text");
    const summary = document.getElementById("summary");
    const resultsPanel = document.getElementById("results-panel");
    const body = document.getElementById("schedule-body");
    const statusText = document.getElementById("status-text");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      button.disabled = true;
      button.textContent = "Scheduling...";
      errorPanel.hidden = true;
      summary.hidden = true;
      resultsPanel.hidden = true;
      body.innerHTML = "";

      try {
        const response = await fetch("/api/schedule", {
          method: "POST",
          body: new FormData(form)
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "The schedule could not be generated.");

        document.getElementById("tasks-count").textContent = data.counts.tasks;
        document.getElementById("scheduled-count").textContent = data.counts.scheduled;
        document.getElementById("unscheduled-count").textContent = data.counts.unscheduled;
        const link = document.getElementById("download-link");
        link.href = data.output;
        link.download = "";

        for (const row of data.scheduled) {
          const tr = document.createElement("tr");
          for (const key of ["date", "assessee", "assessment", "assessor", "assessee_location", "assessor_location"]) {
            const td = document.createElement("td");
            td.textContent = row[key] || "";
            tr.appendChild(td);
          }
          body.appendChild(tr);
        }

        statusText.textContent = `${data.counts.people} rostered people across ${data.counts.dates} dates`;
        summary.hidden = false;
        resultsPanel.hidden = false;
      } catch (error) {
        errorText.innerHTML = error.message;
        errorPanel.hidden = false;
      } finally {
        button.disabled = false;
        button.textContent = "Generate schedule";
      }
    });
  </script>
</body>
</html>
